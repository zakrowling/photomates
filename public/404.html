<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photomates</title>
  <script>
    // GitHub Pages serves this page for unknown paths. Turn /photomates/<room> into /photomates/?room=<room>
    // so a link like zakrowling.github.io/photomates/mate opens (or hosts) the "mate" room.
    (function () {
      var parts = location.pathname.split('/').filter(Boolean);
      var name = parts.pop() || '';
      var base = '/' + parts.join('/') + (parts.length ? '/' : '');
      var valid = /^[a-z0-9](?:[a-z0-9-]{0,14}[a-z0-9])$/i.test(name);
      location.replace(valid ? base + '?room=' + encodeURIComponent(name.toLowerCase()) : base);
    })();
  </script>
</head>
<body style="background:#000"></body>
</html>
